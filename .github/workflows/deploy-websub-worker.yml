name: Deploy WebSub Worker prototype

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: websub-worker-deploy
  cancel-in-progress: false

jobs:
  deploy-and-subscribe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_DISPATCH_TOKEN: ${{ secrets.WEBSUB_GITHUB_DISPATCH_TOKEN }}
      WEBSUB_SECRET: ${{ secrets.WEBSUB_SECRET }}
      WRANGLER_CONFIG: websub/wrangler.toml
      WORKER_NAME: live-music-map-websub-prototype
      FIRST_CHANNEL_ID: UCmfF7JZv26UUKyRedViGIlw
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GITHUB_DISPATCH_TOKEN WEBSUB_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy --config "$WRANGLER_CONFIG"

      - name: Configure Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_DISPATCH_TOKEN" | npx --yes wrangler@4 secret put GITHUB_DISPATCH_TOKEN --config "$WRANGLER_CONFIG"
          printf '%s' "$WEBSUB_SECRET" | npx --yes wrangler@4 secret put WEBSUB_SECRET --config "$WRANGLER_CONFIG"

      - name: Resolve workers.dev callback URL
        id: callback
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(printf '%s' "$response" | jq -er '.result.subdomain')"
          callback="https://$WORKER_NAME.$subdomain.workers.dev/youtube"
          echo "url=$callback" >> "$GITHUB_OUTPUT"
          echo "WebSub callback: $callback" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test hub challenge endpoint
        shell: bash
        env:
          CALLBACK_URL: ${{ steps.callback.outputs.url }}
        run: |
          set -euo pipefail
          challenge="deploy-proof-${GITHUB_RUN_ID}"
          topic="https://www.youtube.com/feeds/videos.xml?channel_id=$FIRST_CHANNEL_ID"
          response="$(curl -fsS -G "$CALLBACK_URL" \
            --data-urlencode 'hub.mode=subscribe' \
            --data-urlencode "hub.topic=$topic" \
            --data-urlencode "hub.challenge=$challenge")"
          test "$response" = "$challenge"
          echo "Worker challenge smoke test: success" >> "$GITHUB_STEP_SUMMARY"

      - name: Request five WebSub subscriptions
        env:
          WEBSUB_CALLBACK_URL: ${{ steps.callback.outputs.url }}
        run: node scripts/websub-subscribe.mjs

      - name: Record prototype state
        shell: bash
        env:
          CALLBACK_URL: ${{ steps.callback.outputs.url }}
        run: |
          {
            echo '### WebSub prototype deployment'
            echo
            echo "- Worker: $WORKER_NAME"
            echo "- Callback: $CALLBACK_URL"
            echo '- Controlled subscriptions requested: 5'
            echo '- Next proof: observe real hub verification and a real YouTube notification -> repository_dispatch -> targeted videos.list.'
          } >> "$GITHUB_STEP_SUMMARY"
