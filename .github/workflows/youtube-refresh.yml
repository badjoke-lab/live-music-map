name: Refresh YouTube live streams

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-youtube-live.mjs'
      - 'data/sources.json'
      - 'data/youtube-state.json'
      - '.github/workflows/youtube-refresh.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '13 0 * * *'
  workflow_dispatch:
    inputs:
      discovery_mode:
        description: 'rss or rss+playlist'
        required: false
        default: 'rss+playlist'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: youtube-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Select discovery mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.discovery_mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" || "${{ github.event.schedule }}" == "13 0 * * *" ]]; then
            echo "value=rss+playlist" >> "$GITHUB_OUTPUT"
          else
            echo "value=rss" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_DISCOVERY_MODE: ${{ steps.mode.outputs.value }}
        run: node scripts/refresh-youtube-live.mjs
      - name: Commit generated data
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- data/sources.json data/streams.json data/acquisition.json data/youtube-state.json; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json data/streams.json data/acquisition.json data/youtube-state.json
          git commit -m "data: refresh YouTube live streams"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Setup Pages for refreshed data
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload refreshed Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy-refreshed-data:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy refreshed data to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
