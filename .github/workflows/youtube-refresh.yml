name: Refresh YouTube live streams

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-youtube-live.mjs'
      - 'data/sources.json'
      - '.github/workflows/youtube-refresh.yml'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Refresh YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/refresh-youtube-live.mjs
      - name: Commit generated data
        shell: bash
        run: |
          if git diff --quiet -- data/sources.json data/streams.json data/acquisition.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json data/streams.json data/acquisition.json
          git commit -m "data: refresh YouTube live streams"
          git push origin HEAD:main
