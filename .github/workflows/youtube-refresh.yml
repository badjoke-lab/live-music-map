name: Refresh YouTube live streams

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-youtube-live.mjs'
      - 'scripts/budgeted-playlist-sweep.mjs'
      - 'scripts/enforce-stream-channel-identity.mjs'
      - 'scripts/correct-title-classification.mjs'
      - 'scripts/update-history-stats.mjs'
      - 'scripts/validate-sources.mjs'
      - 'scripts/apply-source-batch.mjs'
      - 'scripts/apply-source-youtube-overrides.mjs'
      - 'scripts/apply-source-location-overrides.mjs'
      - 'data/source-youtube-overrides.json'
      - 'data/source-location-overrides.json'
      - 'data/source-batch-008.json'
      - 'data/source-batch-008-fill.json'
      - 'data/source-batch-008-fill-five.json'
      - 'data/source-batch-009.json'
      - 'data/source-batch-010.json'
      - 'data/source-batch-011.json'
      - 'data/source-batch-012.json'
      - 'data/source-batch-014.json'
      - 'data/sources.json'
      - 'data/youtube-state.json'
      - '.github/workflows/youtube-refresh.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '13 0 * * *'
  workflow_dispatch:
    inputs:
      discovery_mode:
        description: 'rss or rss+playlist'
        required: false
        default: 'rss+playlist'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: youtube-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply approved M2 global source batch 008 and seed current live
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/apply-source-batch.mjs data/source-batch-008.json
      - name: Apply batch 008 replacement source and seed current live
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/apply-source-batch.mjs data/source-batch-008-fill.json
      - name: Fill batch 008 to 80 international sources and seed current live
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/apply-source-batch.mjs data/source-batch-008-fill-five.json
      - name: Apply modern global source batch 009 and seed current live
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/apply-source-batch.mjs data/source-batch-009.json
      - name: Apply balanced global source batch 010 and seed current live
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/apply-source-batch.mjs data/source-batch-010.json
      - name: Apply balanced global source batch 011 and seed current live
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/apply-source-batch.mjs data/source-batch-011.json
      - name: Apply balanced global source batch 012 and seed current live
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/apply-source-batch.mjs data/source-batch-012.json
      - name: Apply non-classical source batch 014 and seed current live
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/apply-source-batch.mjs data/source-batch-014.json
      - name: Apply verified YouTube source identity overrides
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/apply-source-youtube-overrides.mjs
      - name: Apply verified source location overrides
        run: node scripts/apply-source-location-overrides.mjs
      - name: Validate source contract
        run: node scripts/validate-sources.mjs
      - name: Check acquisition hardening scripts
        run: |
          node --check scripts/budgeted-playlist-sweep.mjs
          node --check scripts/apply-source-youtube-overrides.mjs
          node --check scripts/enforce-stream-channel-identity.mjs
      - name: Select discovery mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REQUESTED_MODE: ${{ inputs.discovery_mode }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "value=${REQUESTED_MODE:-rss+playlist}" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" && "$COMMIT_MESSAGE" == *"[rss-only]"* ]]; then
            echo "value=rss" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" || "$EVENT_SCHEDULE" == "13 0 * * *" ]]; then
            echo "value=rss+playlist" >> "$GITHUB_OUTPUT"
          else
            echo "value=rss" >> "$GITHUB_OUTPUT"
          fi
      - name: Snapshot active streams for history
        run: node scripts/update-history-stats.mjs snapshot
      - name: Refresh YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_DISCOVERY_MODE: ${{ steps.mode.outputs.value }}
        run: node scripts/refresh-youtube-live.mjs
      - name: Budgeted rolling playlist discovery
        if: steps.mode.outputs.value == 'rss'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_PLAYLIST_SWEEP_BUDGET: '130'
        run: node scripts/budgeted-playlist-sweep.mjs
      - name: Enforce stream channel identity
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/enforce-stream-channel-identity.mjs
      - name: Apply title classification precedence
        run: node scripts/correct-title-classification.mjs
      - name: Archive ended streams and build source stats
        run: node scripts/update-history-stats.mjs finalize
      - name: Commit generated data
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- data/sources.json data/streams.json data/acquisition.json data/youtube-state.json data/stream-history.json data/source-stats.json; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json data/streams.json data/acquisition.json data/youtube-state.json data/stream-history.json data/source-stats.json
          git commit -m "data: refresh YouTube live streams and stats"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Setup Pages for refreshed data
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload refreshed Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy-refreshed-data:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy refreshed data to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
