name: Apply source batch 044

on:
  push:
    branches: [main]
    paths:
      - 'data/source-batch-044.json'
      - 'data/source-onboarding-policy.json'
      - 'data/source-retired.json'
      - 'scripts/validate-source-batch-policy.mjs'
      - 'scripts/apply-source-batch.mjs'
      - 'scripts/enforce-source-title-scope.mjs'
      - 'scripts/tighten-batch-044-existing-scopes.mjs'
      - '.github/workflows/source-batch-044.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: source-batch-044
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Enforce source onboarding policy
        run: node scripts/validate-source-batch-policy.mjs data/source-batch-044.json
      - name: Validate strict source title scope
        run: node scripts/enforce-source-title-scope.mjs validate data/source-batch-044.json
      - name: Check source-scope scripts
        run: |
          node --check scripts/enforce-source-title-scope.mjs
          node --check scripts/tighten-batch-044-existing-scopes.mjs
      - name: Preflight source batch 044
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/apply-source-batch.mjs data/source-batch-044.json --preflight
      - name: Apply source batch 044
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/apply-source-batch.mjs data/source-batch-044.json
      - name: Tighten strict scope for existing batch 044 targets
        run: node scripts/tighten-batch-044-existing-scopes.mjs
      - name: Repair uploads playlists
        run: node scripts/repair-missing-uploads-playlists.mjs
      - name: Validate source contract
        run: node scripts/validate-sources.mjs
      - name: Commit canonical sources
        shell: bash
        run: |
          if git diff --quiet -- data/sources.json; then
            echo "No source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json
          git commit -m "Apply source batch 044"
          git push origin HEAD:main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
