name: Apply source batch 022

on:
  push:
    branches: [main]
    paths:
      - 'data/source-batch-022.json'
      - '.github/workflows/source-batch-022.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: source-batch-022
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Preflight source batch 022
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/apply-source-batch.mjs data/source-batch-022.json --preflight
      - name: Apply source batch 022
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/apply-source-batch.mjs data/source-batch-022.json
      - name: Repair uploads playlists
        run: node scripts/repair-missing-uploads-playlists.mjs
      - name: Validate source contract
        run: node scripts/validate-sources.mjs
      - name: Commit canonical sources
        shell: bash
        run: |
          if git diff --quiet -- data/sources.json; then
            echo "No source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json
          git commit -m "Add source batch 022"
          git push origin HEAD:main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
