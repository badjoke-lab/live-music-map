name: Resolve YouTube handles

on:
  push:
    branches: [main]
    paths:
      - 'scripts/resolve-youtube-handles.mjs'
      - '.github/workflows/resolve-youtube-handles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Resolve next non-artist source candidates
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_HANDLES: 'NiEWJP,IRAWMA,A2IM'
          YOUTUBE_VIDEO_IDS: 'Zr-EdlD3F9A,DE95bDO4-74,_4Suf6S7Ow4'
        run: |
          node --check scripts/resolve-youtube-handles.mjs
          node scripts/resolve-youtube-handles.mjs
