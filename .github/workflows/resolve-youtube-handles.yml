name: Resolve YouTube handles

on:
  push:
    branches: [main]
    paths:
      - 'scripts/resolve-youtube-handles.mjs'
      - '.github/workflows/resolve-youtube-handles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Resolve channel identity and livestream metadata
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_IDS: 'UCIzviXrH8rVQV9lfU7X3t-g'
          YOUTUBE_SCAN_LIMIT: '50'
        run: |
          node --check scripts/resolve-youtube-handles.mjs
          node scripts/resolve-youtube-handles.mjs
