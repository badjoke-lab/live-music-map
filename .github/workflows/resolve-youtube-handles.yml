name: Resolve YouTube handles

on:
  push:
    branches: [main]
    paths:
      - 'scripts/resolve-youtube-handles.mjs'
      - '.github/workflows/resolve-youtube-handles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Resolve candidate channel identity and livestream metadata
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_VIDEO_IDS: 'qM0I5DezXd0,j2rs6TFXlkI,wGPF4NKckmY,8_A9fuN0CrY'
          YOUTUBE_HANDLES: 'vaundy'
        run: |
          node --check scripts/resolve-youtube-handles.mjs
          node scripts/resolve-youtube-handles.mjs
