name: Resolve YouTube handles

on:
  push:
    branches: [research/resolve-next-sources-056]
    paths:
      - '.github/workflows/resolve-youtube-handles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/resolve-next-sources-056
      - name: Scan Villa Maria source candidate
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_IDS: 'UC2rMd1z6NwV-B13v6Sy37zg'
          YOUTUBE_SCAN_LIMIT: '50'
        run: |
          node --check scripts/resolve-youtube-handles.mjs
          node scripts/resolve-youtube-handles.mjs
