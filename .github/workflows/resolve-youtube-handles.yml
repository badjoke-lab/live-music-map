name: Resolve YouTube handles

on:
  push:
    branches: [research/resolve-next-sources-056]
    paths:
      - '.github/workflows/resolve-youtube-handles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/resolve-next-sources-056
      - name: Scan Dolores and Catamarca source candidates
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_IDS: 'UCdR5dwk4uAINC24MGj915WA,UClvQGfbj1T_ofautTOYAaEg'
          YOUTUBE_SCAN_LIMIT: '50'
        run: |
          node --check scripts/resolve-youtube-handles.mjs
          node scripts/resolve-youtube-handles.mjs
