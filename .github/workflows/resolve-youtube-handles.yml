name: Resolve YouTube handles

on:
  push:
    branches: [research/resolve-next-sources-056]
    paths:
      - '.github/workflows/resolve-youtube-handles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/resolve-next-sources-056
      - name: Resolve next source candidates
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_HANDLES: 'FestivalJesusMariaOficial,culturacatamarca,AnfiteatroVillaMaría'
          YOUTUBE_VIDEO_IDS: 'sv4gjLZTzNk,hqxuQiXn5j4,w3uCQGnX_mg'
        run: |
          node --check scripts/resolve-youtube-handles.mjs
          node scripts/resolve-youtube-handles.mjs
