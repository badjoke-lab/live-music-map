name: Resolve YouTube handles

on:
  push:
    branches: [main]
    paths:
      - 'scripts/resolve-youtube-handles.mjs'
      - '.github/workflows/resolve-youtube-handles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Scan next candidate channels for livestream history
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_IDS: 'UCXHNN4xg8VnFqqPnEhr8DzQ,UCE_mCxfNiphp7o0JjvINygg,UC3ZH2GznkvyfOsbTO7vAgkA,UCGNnGrpbspf0i4-SOmwYkYA'
          YOUTUBE_SCAN_LIMIT: '50'
        run: |
          node --check scripts/resolve-youtube-handles.mjs
          node scripts/resolve-youtube-handles.mjs
