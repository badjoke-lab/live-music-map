<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Music Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#0b0d10;color:#f4f4f4}
button,select,input{font:inherit}
header{min-height:64px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #252932;background:#101318}
header b{font-size:18px;white-space:nowrap}
header input{flex:1;max-width:620px;background:#171b22;border:1px solid #2a303a;border-radius:10px;color:#fff;padding:11px 13px}
select{background:#171b22;border:1px solid #2a303a;border-radius:9px;color:#fff;padding:9px}
.toolbar{padding:10px 16px;display:flex;gap:8px;overflow:auto;border-bottom:1px solid #252932;background:#101318}
.toolbar button{background:#1a1f27;border:1px solid #2c333d;color:#ddd;border-radius:999px;padding:8px 11px;white-space:nowrap}
.toolbar button.active{background:#303846;color:#fff}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr) 390px;height:calc(100vh - 117px)}
.sidebar,.detail{overflow:auto;background:#11151a}
.sidebar{border-right:1px solid #252932}
.detail{border-left:1px solid #252932}
.center-pane{position:relative;min-width:0;min-height:0;background:#090b0e}
#map{width:100%;height:100%}
.section{padding:14px}
.source{padding:12px;border-bottom:1px solid #242a31;cursor:pointer}
.source:hover{background:#171c22}
.name{font-weight:700}
.meta{font-size:12px;color:#aab2bd;margin-top:3px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:11px;border:1px solid #39424d;border-radius:999px;padding:3px 6px;color:#c8d0da}
.status{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:3px 5px;margin-right:6px}
.status.live{background:#e53935}
.status.upcoming{background:#fb8c00}
.status.source{background:#546e7a}
.detail h2{margin:0 0 4px}
.detail h3{margin:18px 0 8px}
.links a{display:inline-block;margin:4px 8px 4px 0;color:#8ab4f8}
.links button{display:inline-block;margin:4px 8px 4px 0;background:#262d36;border:1px solid #46515e;border-radius:8px;color:#fff;padding:7px 10px;cursor:pointer}
.links button:hover{background:#323b47}
.notice{font-size:12px;color:#f2bd66;background:#2a2317;border:1px solid #5f4a24;padding:9px;border-radius:8px;margin-top:10px}
.stream{margin:10px 0;padding:11px;border:1px solid #303640;border-radius:10px;background:#171b22}
.stream.live-card{border-color:#5a3434}
.stream.upcoming-card{padding:10px}
.stream h3{font-size:15px;margin:7px 0}
.stream iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;margin-top:10px;background:#000}
.stream-grid{display:grid;grid-template-columns:90px 1fr;gap:5px 8px;font-size:12px;margin-top:8px}
.stream-grid dt{color:#89939f}
.stream-grid dd{margin:0}
.legend{position:absolute;z-index:1000;left:10px;bottom:10px;background:#111d;padding:9px;border:1px solid #333;border-radius:8px;font-size:11px}
.acq{font-size:11px;margin-top:6px;color:#9da6b2}
.cluster-wrap{position:relative;width:58px;height:58px;display:grid;place-items:center}
.cluster-core{display:grid;place-items:center;width:38px;height:38px;background:#59636f;border:2px solid #d8dde3;border-radius:50%;font-weight:850;font-size:12px;color:#fff;box-shadow:0 4px 14px #0009}
.cluster-wrap.has-live .cluster-core{border-color:#ff8b87;box-shadow:0 0 0 4px #e53935,0 0 0 9px #e5393538,0 0 22px #e53935aa,0 4px 14px #0009;animation:cluster-live-pulse 1.8s ease-in-out infinite}
.cluster-wrap.has-upcoming .cluster-core{border-color:#ffd08a;box-shadow:0 0 0 4px #fb8c00,0 0 0 8px #fb8c0030,0 4px 14px #0009}
.cluster-state-badge{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;border-radius:999px;padding:2px 5px;font-size:8px;font-weight:900;line-height:1.15;color:#fff;border:1px solid #fff8;box-shadow:0 2px 8px #000b}
.cluster-live-badge{top:-7px;background:#e53935}
.cluster-up-badge{bottom:-7px;background:#fb8c00}
@keyframes cluster-live-pulse{0%,100%{filter:drop-shadow(0 0 0 #e5393500)}50%{filter:drop-shadow(0 0 7px #e53935cc)}}
.source-info{padding:2px 0 4px}
.source-info-row{margin:10px 0}
.source-info-label{font-size:11px;color:#89939f;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.upcoming-more{margin-top:8px;border:1px solid #303640;border-radius:10px;background:#14181e}
.upcoming-more summary{cursor:pointer;padding:10px 12px;color:#cdd5df;font-size:13px}
.upcoming-more[open] summary{border-bottom:1px solid #303640}
.upcoming-more .more-body{padding:0 10px 8px}
.player-layer{position:fixed;z-index:4000;left:50%;top:52%;transform:translate(-50%,-50%);width:min(960px,62vw);min-width:520px;max-width:calc(100vw - 48px);background:#0c0f14;border:1px solid #3a424e;border-radius:12px;box-shadow:0 22px 70px #000d;overflow:hidden;resize:both}
.player-layer[hidden]{display:none}
.player-head{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#151a21;border-bottom:1px solid #2d343e;cursor:move;user-select:none}
.player-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:13px}
.player-close{border:1px solid #46515e;background:#252c35;color:#fff;border-radius:7px;padding:5px 9px;cursor:pointer}
.player-body{aspect-ratio:16/9;min-height:292px;background:#000}
.player-body iframe{display:block;width:100%;height:100%;border:0}
@media(max-width:900px){
  header{flex-wrap:wrap}
  header input{order:3;min-width:100%}
  .layout{display:block;height:calc(100vh - 168px);position:relative}
  .sidebar{display:none}
  .detail{position:absolute;left:0;right:0;bottom:0;max-height:48%;border-left:0;border-top:1px solid #303640;z-index:1100;border-radius:18px 18px 0 0}
  .center-pane{height:100%}
  .player-layer{width:94vw;min-width:0;max-width:94vw;top:30%;resize:none}
  .player-body{min-height:0}
}
</style>
</head>
<body>
<header>
  <b>LIVE MUSIC MAP</b>
  <input id="q" placeholder="配信元・都市・国・ジャンルで検索">
  <select id="tz" aria-label="Time zone"></select>
</header>
<div class="toolbar">
  <button class="active" data-filter="all">すべて</button>
  <button data-filter="live">LIVE</button>
  <button data-filter="upcoming">Upcoming</button>
  <button data-filter="festival">Festival</button>
  <button data-filter="radio">Radio</button>
  <button data-filter="independent_media">Independent</button>
  <button data-filter="studio_media">Studio / Media</button>
</div>
<div class="layout">
  <aside class="sidebar">
    <div class="section">
      <b>配信元</b>
      <div class="meta">LIVEを最優先、Upcomingは開始が近い順。音楽ライブ確認済みの配信だけ表示。</div>
      <div class="acq" id="acq"></div>
    </div>
    <div id="list"></div>
  </aside>
  <main class="center-pane">
    <div id="map"></div>
    <div class="legend">単独ピン: 赤 LIVE / 橙 Upcoming / 灰 Sourceのみ · クラスタ中央=配信元総数 · 赤リング=LIVEあり · 橙リング=Upcomingあり</div>
  </main>
  <aside class="detail">
    <div class="section" id="detail"><h2>配信元を選択</h2></div>
  </aside>
</div>
<div class="player-layer" id="playerLayer" hidden>
  <div class="player-head" id="playerDragHandle">
    <div class="player-title" id="playerTitle">YouTube Live</div>
    <button class="player-close" id="playerClose" type="button">閉じる</button>
  </div>
  <div class="player-body"><iframe id="playerFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen title="YouTube player"></iframe></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const map=L.map('map',{worldCopyJump:true}).setView([28,10],2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
const markerLayer=L.markerClusterGroup({showCoverageOnHover:false,spiderfyOnMaxZoom:true,removeOutsideVisibleBounds:true,maxClusterRadius:44,iconCreateFunction(cluster){const children=cluster.getAllChildMarkers();const total=children.length;const live=children.filter(m=>m.options.sourceState==='live').length;const upcoming=children.filter(m=>m.options.sourceState==='upcoming').length;const state=live>0?'has-live':upcoming>0?'has-upcoming':'source-only';const liveBadge=live?`<span class="cluster-state-badge cluster-live-badge">LIVE ${live}</span>`:'';const upBadge=upcoming?`<span class="cluster-state-badge cluster-up-badge">UP ${upcoming}</span>`:'';return L.divIcon({className:'',html:`<div class="cluster-wrap ${state}" title="${total} sources · LIVE ${live} · Upcoming ${upcoming}"><div class="cluster-core">${total}</div>${liveBadge}${upBadge}</div>`,iconSize:[58,58],iconAnchor:[29,29]})}}).addTo(map);
let sources=[],streams=[],acquisition={},currentFilter='all',selectedSource=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const badge=g=>`<span class="badge">${esc(g)}</span>`;
const sourceStreams=id=>streams.filter(s=>s.source_id===id&&s.music_live_status==='verified');
const stateFor=s=>sourceStreams(s.id).some(x=>x.status==='live')?'live':sourceStreams(s.id).some(x=>x.status==='upcoming')?'upcoming':'source';
const stateRank={live:0,upcoming:1,source:2};
function nextUpcoming(source){const times=sourceStreams(source.id).filter(s=>s.status==='upcoming').map(s=>Date.parse(s.scheduled_start)).filter(Number.isFinite);return times.length?Math.min(...times):Infinity}
function liveCount(source){return sourceStreams(source.id).filter(s=>s.status==='live').length}
function sourceOrder(a,b){const sa=stateFor(a),sb=stateFor(b);if(stateRank[sa]!==stateRank[sb])return stateRank[sa]-stateRank[sb];if(sa==='live'&&liveCount(a)!==liveCount(b))return liveCount(b)-liveCount(a);if(sa==='upcoming'&&nextUpcoming(a)!==nextUpcoming(b))return nextUpcoming(a)-nextUpcoming(b);return a.name.localeCompare(b.name)}
function orderedStreams(id){return sourceStreams(id).slice().sort((a,b)=>{const ar=a.status==='live'?0:1,br=b.status==='live'?0:1;if(ar!==br)return ar-br;if(a.status==='upcoming'&&b.status==='upcoming')return (Date.parse(a.scheduled_start)||Infinity)-(Date.parse(b.scheduled_start)||Infinity);return String(a.actual_start||a.scheduled_start||a.title).localeCompare(String(b.actual_start||b.scheduled_start||b.title))})}
const localZone=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';
const zones=[localZone,'UTC','Asia/Tokyo','Europe/Berlin','America/New_York','America/Los_Angeles','Australia/Sydney'].filter((v,i,a)=>a.indexOf(v)===i);
const tz=document.getElementById('tz');tz.innerHTML=zones.map(z=>`<option value="${esc(z)}">${esc(z===localZone?`Local · ${z}`:z)}</option>`).join('');
function formatTime(value){if(!value)return '未確認';try{return new Intl.DateTimeFormat(undefined,{timeZone:tz.value,dateStyle:'medium',timeStyle:'short'}).format(new Date(value))}catch{return value}}
function openPlayer(videoId,title){if(!/^[A-Za-z0-9_-]{11}$/.test(videoId))return;const layer=document.getElementById('playerLayer');document.getElementById('playerTitle').textContent=title||'YouTube Live';document.getElementById('playerFrame').src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}?autoplay=1`;layer.hidden=false}
function closePlayer(){const layer=document.getElementById('playerLayer');layer.hidden=true;document.getElementById('playerFrame').src=''}
function streamCard(s,{embed=false,compact=false}={}){const perf=s.performers?.length?s.performers.join(', '):'未確認';const venue=s.venue||'未確認';const genres=s.genres?.length?s.genres.join(' / '):'未確認';const canEmbed=s.youtube_video_id&&s.embed_allowed!==false;const inlineEmbed=embed&&canEmbed?`<iframe loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(s.youtube_video_id)}"></iframe>`:'';const playerButton=canEmbed?`<button type="button" data-player-video="${esc(s.youtube_video_id)}" data-player-title="${esc(s.title)}">シアター</button>`:'';const details=compact?'':`<dl class="stream-grid"><dt>配信種別</dt><dd>${esc(s.content_type||'未確認')}</dd><dt>出演者</dt><dd>${esc(perf)}</dd><dt>会場</dt><dd>${esc(venue)}</dd><dt>ジャンル</dt><dd>${esc(genres)}</dd></dl>`;return `<div class="stream ${s.status==='live'?'live-card':'upcoming-card'}"><span class="status ${esc(s.status)}">${esc(s.status.toUpperCase())}</span><h3>${esc(s.title)}</h3><div class="meta">${s.status==='live'?'開始':'予定'}: ${esc(formatTime(s.actual_start||s.scheduled_start))}${s.concurrent_viewers!=null?` · ${Number(s.concurrent_viewers).toLocaleString()} watching`:''}</div>${inlineEmbed}${details}<div class="links">${playerButton}<a target="_blank" rel="noopener" href="${esc(s.youtube_url)}">YouTubeで開く</a></div></div>`}
function sourceInfoHtml(s,locationLabel,locationPrecision){return `<div class="source-info"><div class="source-info-row"><div class="source-info-label">公式リンク</div><div class="links">${s.official_site?`<a target="_blank" rel="noopener" href="${esc(s.official_site)}">公式サイト</a>`:''}${s.youtube_url?`<a target="_blank" rel="noopener" href="${esc(s.youtube_url)}">YouTube</a>`:''}${s.schedule_url?`<a target="_blank" rel="noopener" href="${esc(s.schedule_url)}">Schedule</a>`:''}</div></div><div class="source-info-row"><div class="source-info-label">位置</div><div>${esc(locationLabel)}</div><div class="meta">precision: ${esc(locationPrecision)}</div></div><div class="source-info-row"><div class="source-info-label">配信元が扱うジャンル</div><div>${(s.genres||[]).map(esc).join(' / ')||'未確認'}</div></div><div class="source-info-row"><div class="source-info-label">配信形式</div><div>${(s.formats||[]).map(esc).join(' / ')||'未確認'}</div></div>${s.note?`<div class="source-info-row"><div class="source-info-label">備考</div><div>${esc(s.note)}</div></div>`:''}</div>`}
function show(s){if(!s)return;selectedSource=s;const ss=orderedStreams(s.id);const live=ss.filter(x=>x.status==='live');const upcoming=ss.filter(x=>x.status==='upcoming');const locationLabel=s.location?.label||[s.city,s.country].filter(Boolean).join(', ')||'未確認';const locationPrecision=s.location?.precision||'unknown';const liveHtml=live.length?live.map(x=>streamCard(x,{embed:true})).join(''):`<div class="meta">現在LIVEはありません。</div>`;const firstUpcoming=upcoming.slice(0,2);const restUpcoming=upcoming.slice(2);const upcomingHtml=upcoming.length?`${firstUpcoming.map(x=>streamCard(x,{compact:true})).join('')}${restUpcoming.length?`<details class="upcoming-more"><summary>ほか ${restUpcoming.length}件のUpcoming</summary><div class="more-body">${restUpcoming.map(x=>streamCard(x,{compact:true})).join('')}</div></details>`:''}`:`<div class="meta">Upcomingはありません。</div>`;document.getElementById('detail').innerHTML=`<h2>${esc(s.name)}</h2><div class="meta">${esc(locationLabel)} · ${esc(s.type)}</div><div class="badges">${(s.genres||[]).map(badge).join('')}</div><h3>LIVE</h3>${liveHtml}<h3>配信元情報</h3>${sourceInfoHtml(s,locationLabel,locationPrecision)}<h3>Upcoming</h3>${upcomingHtml}`}
function sourceIcon(state){const color=state==='live'?'#e53935':state==='upcoming'?'#fb8c00':'#607d8b';return L.divIcon({className:'',html:`<div style="width:22px;height:22px;background:${color};border:2px solid white;border-radius:50%;box-shadow:0 0 0 6px ${color}33"></div>`,iconSize:[22,22],iconAnchor:[11,11]})}
function render(){markerLayer.clearLayers();const q=document.getElementById('q').value.trim().toLowerCase();const subset=sources.filter(s=>{const blob=[s.name,s.country,s.region,s.city,s.type,...(s.genres||[]),...(s.formats||[])].join(' ').toLowerCase();const state=stateFor(s);const okState=currentFilter==='live'||currentFilter==='upcoming'?state===currentFilter:true;const okType=['festival','radio','independent_media','studio_media'].includes(currentFilter)?s.type===currentFilter:true;return(!q||blob.includes(q))&&okState&&okType}).sort(sourceOrder);document.getElementById('list').innerHTML=subset.map(s=>{const st=stateFor(s);const upcoming=orderedStreams(s.id).find(x=>x.status==='upcoming');const next=st==='upcoming'&&upcoming?` · ${formatTime(upcoming.scheduled_start)}`:'';return `<div class="source" data-id="${esc(s.id)}"><div class="name"><span class="status ${st}">${st==='source'?'SOURCE':st.toUpperCase()}</span>${esc(s.name)}</div><div class="meta">${esc(s.city||'')}${s.city&&s.country?', ':''}${esc(s.country||'')} · ${esc(s.type)}${esc(next)}</div><div class="badges">${(s.genres||[]).slice(0,5).map(badge).join('')}</div></div>`}).join('');document.querySelectorAll('.source').forEach(el=>{el.onclick=()=>show(sources.find(s=>s.id===el.dataset.id))});const points=[];for(const s of subset){const lat=Number(s.location?.lat),lon=Number(s.location?.lon);if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;const st=stateFor(s);points.push(L.marker([lat,lon],{icon:sourceIcon(st),sourceState:st,title:s.name}).on('click',()=>show(s)))}markerLayer.addLayers(points);return subset}
Promise.all([fetch('./data/sources.json').then(r=>r.json()),fetch('./data/streams.json').then(r=>r.json()),fetch('./data/acquisition.json').then(r=>r.json())]).then(([a,b,c])=>{sources=a;streams=b;acquisition=c;const verified=streams.filter(s=>s.music_live_status==='verified').length;document.getElementById('acq').textContent=acquisition?.youtube?.configured?`YouTube自動取得: 有効 · 音楽LIVE候補 ${verified}件`:'YouTube自動取得: APIキー未設定';const ordered=render();if(ordered[0])show(ordered[0])});
document.getElementById('q').addEventListener('input',render);
tz.addEventListener('change',()=>{if(selectedSource)show(selectedSource);render()});
document.querySelectorAll('.toolbar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.toolbar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;const ordered=render();if(ordered.length&&!ordered.includes(selectedSource))show(ordered[0])});
document.addEventListener('click',e=>{const button=e.target.closest('[data-player-video]');if(button)openPlayer(button.dataset.playerVideo,button.dataset.playerTitle)});
document.getElementById('playerClose').addEventListener('click',closePlayer);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('playerLayer').hidden)closePlayer()});
(function makePlayerDraggable(){const layer=document.getElementById('playerLayer');const handle=document.getElementById('playerDragHandle');let drag=null;handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const rect=layer.getBoundingClientRect();drag={dx:e.clientX-rect.left,dy:e.clientY-rect.top};layer.style.transform='none';layer.style.left=`${rect.left}px`;layer.style.top=`${rect.top}px`;handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!drag)return;const maxX=Math.max(0,window.innerWidth-layer.offsetWidth);const maxY=Math.max(0,window.innerHeight-layer.offsetHeight);layer.style.left=`${Math.min(maxX,Math.max(0,e.clientX-drag.dx))}px`;layer.style.top=`${Math.min(maxY,Math.max(0,e.clientY-drag.dy))}px`});handle.addEventListener('pointerup',()=>{drag=null});handle.addEventListener('pointercancel',()=>{drag=null})})();
</script>
</body>
</html>
