<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Music Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f4f4f4}button,select,input{font:inherit}
header{min-height:64px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #252932;background:#101318}header b{font-size:18px;white-space:nowrap}header input{flex:1;max-width:620px;background:#171b22;border:1px solid #2a303a;border-radius:10px;color:#fff;padding:11px 13px}select{background:#171b22;border:1px solid #2a303a;border-radius:9px;color:#fff;padding:9px}
.toolbar{padding:10px 16px;display:flex;gap:8px;overflow:auto;border-bottom:1px solid #252932;background:#101318}.toolbar button{background:#1a1f27;border:1px solid #2c333d;color:#ddd;border-radius:999px;padding:8px 11px;white-space:nowrap}.toolbar button.active{background:#303846;color:#fff}
.layout{display:grid;grid-template-columns:300px 1fr 390px;height:calc(100vh - 117px)}.sidebar,.detail{overflow:auto;background:#11151a}.sidebar{border-right:1px solid #252932}.detail{border-left:1px solid #252932}#map{height:100%}.section{padding:14px}.source{padding:12px;border-bottom:1px solid #242a31;cursor:pointer}.source:hover{background:#171c22}.name{font-weight:700}.meta{font-size:12px;color:#aab2bd;margin-top:3px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.badge{font-size:11px;border:1px solid #39424d;border-radius:999px;padding:3px 6px;color:#c8d0da}.status{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:3px 5px;margin-right:6px}.status.live{background:#e53935}.status.upcoming{background:#fb8c00}.status.source{background:#546e7a}.detail h2{margin:0 0 4px}.links a{display:inline-block;margin:4px 8px 4px 0;color:#8ab4f8}.links button{display:inline-block;margin:4px 8px 4px 0;background:#262d36;border:1px solid #46515e;border-radius:8px;color:#fff;padding:7px 10px;cursor:pointer}.links button:hover{background:#323b47}.notice{font-size:12px;color:#f2bd66;background:#2a2317;border:1px solid #5f4a24;padding:9px;border-radius:8px;margin-top:10px}.stream{margin:12px 0;padding:11px;border:1px solid #303640;border-radius:10px;background:#171b22}.stream h3{font-size:15px;margin:7px 0}.stream iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;margin-top:10px}.stream-grid{display:grid;grid-template-columns:90px 1fr;gap:5px 8px;font-size:12px;margin-top:8px}.stream-grid dt{color:#89939f}.stream-grid dd{margin:0}.legend{position:absolute;z-index:1000;left:10px;bottom:10px;background:#111d;padding:9px;border:1px solid #333;border-radius:8px;font-size:11px}.acq{font-size:11px;margin-top:6px;color:#9da6b2}
.theater[hidden]{display:none}.theater{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:24px}.theater-panel{width:min(1280px,94vw)}.theater-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}.theater-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.theater-close{flex:0 0 auto;background:#20252c;border:1px solid #4b5561;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.theater iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000;box-shadow:0 18px 70px #000}.theater-open{overflow:hidden}
@media(max-width:900px){header{flex-wrap:wrap}header input{order:3;min-width:100%}.layout{display:block;height:calc(100vh - 168px);position:relative}.sidebar{display:none}.detail{position:absolute;left:0;right:0;bottom:0;max-height:48%;border-left:0;border-top:1px solid #303640;z-index:1100;border-radius:18px 18px 0 0}#map{height:100%}.theater{padding:8px}.theater-panel{width:100%}}
</style></head><body>
<header><b>LIVE MUSIC MAP</b><input id="q" placeholder="配信元・都市・国・ジャンルで検索"><select id="tz" aria-label="Time zone"></select></header>
<div class="toolbar"><button class="active" data-filter="all">すべて</button><button data-filter="live">LIVE</button><button data-filter="upcoming">Upcoming</button><button data-filter="festival">Festival</button><button data-filter="radio">Radio</button><button data-filter="independent_media">Independent</button><button data-filter="studio_media">Studio / Media</button></div>
<div class="layout"><aside class="sidebar"><div class="section"><b>配信元</b><div class="meta">LIVEを最優先、Upcomingは開始が近い順。</div><div class="acq" id="acq"></div></div><div id="list"></div></aside><main style="position:relative"><div id="map"></div><div class="legend">赤 LIVE / 橙 Upcoming / 灰 Sourceのみ</div></main><aside class="detail"><div class="section" id="detail"><h2>配信元を選択</h2></div></aside></div>
<div class="theater" id="theater" hidden aria-modal="true" role="dialog" aria-label="大きいプレーヤー"><div class="theater-panel"><div class="theater-head"><div class="theater-title" id="theaterTitle"></div><button class="theater-close" id="theaterClose" type="button">閉じる</button></div><iframe id="theaterFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen title="YouTube player"></iframe></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{worldCopyJump:true}).setView([28,10],2);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
let sources=[],streams=[],acquisition={},markers=[],currentFilter='all',selectedSource=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const badge=g=>`<span class="badge">${esc(g)}</span>`;
const sourceStreams=id=>streams.filter(s=>s.source_id===id);const stateFor=s=>sourceStreams(s.id).some(x=>x.status==='live')?'live':sourceStreams(s.id).some(x=>x.status==='upcoming')?'upcoming':'source';
const stateRank={live:0,upcoming:1,source:2};
function nextUpcoming(source){const times=sourceStreams(source.id).filter(s=>s.status==='upcoming').map(s=>Date.parse(s.scheduled_start)).filter(Number.isFinite);return times.length?Math.min(...times):Infinity}
function liveCount(source){return sourceStreams(source.id).filter(s=>s.status==='live').length}
function sourceOrder(a,b){const sa=stateFor(a),sb=stateFor(b);if(stateRank[sa]!==stateRank[sb])return stateRank[sa]-stateRank[sb];if(sa==='live'&&liveCount(a)!==liveCount(b))return liveCount(b)-liveCount(a);if(sa==='upcoming'&&nextUpcoming(a)!==nextUpcoming(b))return nextUpcoming(a)-nextUpcoming(b);return a.name.localeCompare(b.name)}
function orderedStreams(id){return sourceStreams(id).slice().sort((a,b)=>{const ar=a.status==='live'?0:1,br=b.status==='live'?0:1;if(ar!==br)return ar-br;if(a.status==='upcoming'&&b.status==='upcoming')return (Date.parse(a.scheduled_start)||Infinity)-(Date.parse(b.scheduled_start)||Infinity);return String(a.actual_start||a.scheduled_start||a.title).localeCompare(String(b.actual_start||b.scheduled_start||b.title))})}
const localZone=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';const zones=[localZone,'UTC','Asia/Tokyo','Europe/Berlin','America/New_York','America/Los_Angeles'].filter((v,i,a)=>a.indexOf(v)===i);const tz=document.getElementById('tz');tz.innerHTML=zones.map(z=>`<option value="${esc(z)}">${esc(z===localZone?`Local · ${z}`:z)}</option>`).join('');
function formatTime(value){if(!value)return '未確認';try{return new Intl.DateTimeFormat(undefined,{timeZone:tz.value,dateStyle:'medium',timeStyle:'short'}).format(new Date(value))}catch{return value}}
function openTheater(videoId,title){if(!/^[A-Za-z0-9_-]{11}$/.test(videoId))return;document.getElementById('theaterTitle').textContent=title||'YouTube Live';document.getElementById('theaterFrame').src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}?autoplay=1`;document.getElementById('theater').hidden=false;document.body.classList.add('theater-open');document.getElementById('theaterClose').focus()}
function closeTheater(){document.getElementById('theater').hidden=true;document.getElementById('theaterFrame').src='';document.body.classList.remove('theater-open')}
function streamCard(s){const perf=s.performers?.length?s.performers.join(', '):'未確認';const venue=s.venue||'未確認';const genres=s.genres?.length?s.genres.join(' / '):'未確認';const canEmbed=s.youtube_video_id&&s.embed_allowed!==false;const embed=canEmbed?`<iframe loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(s.youtube_video_id)}"></iframe>`:'';const theaterButton=canEmbed?`<button type="button" data-theater-video="${esc(s.youtube_video_id)}" data-theater-title="${esc(s.title)}">大きく見る</button>`:'';return `<div class="stream"><span class="status ${esc(s.status)}">${esc(s.status.toUpperCase())}</span><h3>${esc(s.title)}</h3><div class="meta">${s.status==='live'?'開始': '予定'}: ${esc(formatTime(s.actual_start||s.scheduled_start))}${s.concurrent_viewers!=null?` · ${Number(s.concurrent_viewers).toLocaleString()} watching`:''}</div>${embed}<dl class="stream-grid"><dt>出演者</dt><dd>${esc(perf)}</dd><dt>会場</dt><dd>${esc(venue)}</dd><dt>ジャンル</dt><dd>${esc(genres)}</dd></dl><div class="links">${theaterButton}<a target="_blank" rel="noopener" href="${esc(s.youtube_url)}">YouTubeで開く</a></div></div>`}
function show(s){selectedSource=s;const ss=orderedStreams(s.id);const streamHtml=ss.length?ss.map(streamCard).join(''):`<div class="notice">現在、自動取得済みのLIVE / Upcomingはありません。</div>`;document.getElementById('detail').innerHTML=`<h2>${esc(s.name)}</h2><div class="meta">${esc(s.location.label)} · ${esc(s.type)}</div><div class="badges">${s.genres.map(badge).join('')}</div><h3>現在 / 近日</h3>${streamHtml}<h3>公式リンク</h3><div class="links"><a target="_blank" rel="noopener" href="${esc(s.official_site)}">公式サイト</a><a target="_blank" rel="noopener" href="${esc(s.youtube_url)}">YouTube</a><a target="_blank" rel="noopener" href="${esc(s.schedule_url)}">Schedule</a></div><h3>位置</h3><div>${esc(s.location.label)}</div><div class="meta">precision: ${esc(s.location.precision)}</div><h3>配信元が扱うジャンル</h3><div>${s.genres.map(esc).join(' / ')}</div><div class="notice">配信元レベルのジャンルを個別streamへコピーしません。出演者・会場・streamジャンルも確認できた場合だけ表示します。</div><h3>備考</h3><div>${esc(s.note)}</div>`}
function render(){markers.forEach(m=>map.removeLayer(m));markers=[];const q=document.getElementById('q').value.trim().toLowerCase();const subset=sources.filter(s=>{const blob=[s.name,s.country,s.region,s.city,s.type,...s.genres].join(' ').toLowerCase();const state=stateFor(s);const okState=currentFilter==='live'||currentFilter==='upcoming'?state===currentFilter:true;const okType=['festival','radio','independent_media','studio_media'].includes(currentFilter)?s.type===currentFilter:true;return(!q||blob.includes(q))&&okState&&okType}).sort(sourceOrder);document.getElementById('list').innerHTML=subset.map(s=>{const st=stateFor(s),next=st==='upcoming'?` · ${formatTime(orderedStreams(s.id).find(x=>x.status==='upcoming')?.scheduled_start)}`:'';return `<div class="source" data-id="${esc(s.id)}"><div class="name"><span class="status ${st}">${st==='source'?'SOURCE':st.toUpperCase()}</span>${esc(s.name)}</div><div class="meta">${esc(s.city)}, ${esc(s.country)} · ${esc(s.type)}${esc(next)}</div><div class="badges">${s.genres.slice(0,5).map(badge).join('')}</div></div>`}).join('');document.querySelectorAll('.source').forEach(el=>el.onclick=()=>show(sources.find(s=>s.id===el.dataset.id)));subset.forEach(s=>{const st=stateFor(s),c=st==='live'?'#e53935':st==='upcoming'?'#fb8c00':'#607d8b';const icon=L.divIcon({className:'',html:`<div style="width:22px;height:22px;background:${c};border:2px solid white;border-radius:50%;box-shadow:0 0 0 6px ${c}33"></div>`,iconSize:[22,22],iconAnchor:[11,11]});markers.push(L.marker([s.location.lat,s.location.lon],{icon}).addTo(map).on('click',()=>show(s)))});return subset}
Promise.all([fetch('./data/sources.json').then(r=>r.json()),fetch('./data/streams.json').then(r=>r.json()),fetch('./data/acquisition.json').then(r=>r.json())]).then(([a,b,c])=>{sources=a;streams=b;acquisition=c;document.getElementById('acq').textContent=acquisition?.youtube?.configured?'YouTube自動取得: 有効':'YouTube自動取得: APIキー未設定';const ordered=render();if(ordered[0])show(ordered[0])});
document.getElementById('q').addEventListener('input',render);tz.addEventListener('change',()=>{if(selectedSource)show(selectedSource);render()});document.querySelectorAll('.toolbar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.toolbar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;const ordered=render();if(ordered.length&&!ordered.includes(selectedSource))show(ordered[0])});
document.addEventListener('click',e=>{const button=e.target.closest('[data-theater-video]');if(button)openTheater(button.dataset.theaterVideo,button.dataset.theaterTitle)});document.getElementById('theaterClose').addEventListener('click',closeTheater);document.getElementById('theater').addEventListener('click',e=>{if(e.target.id==='theater')closeTheater()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('theater').hidden)closeTheater()});
</script></body></html>
