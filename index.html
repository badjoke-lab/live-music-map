<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Music Map MVP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f4f4f4}
header{height:64px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid #252932;background:#101318}header b{font-size:18px}header input{flex:1;max-width:640px;background:#171b22;border:1px solid #2a303a;border-radius:10px;color:#fff;padding:11px 13px}
.toolbar{padding:10px 16px;display:flex;gap:8px;overflow:auto;border-bottom:1px solid #252932;background:#101318}.toolbar button{background:#1a1f27;border:1px solid #2c333d;color:#ddd;border-radius:999px;padding:8px 11px;white-space:nowrap}
.layout{display:grid;grid-template-columns:300px 1fr 360px;height:calc(100vh - 117px)}.sidebar,.detail{overflow:auto;background:#11151a}.sidebar{border-right:1px solid #252932}.detail{border-left:1px solid #252932}#map{height:100%}.section{padding:14px}.source{padding:12px;border-bottom:1px solid #242a31;cursor:pointer}.source:hover{background:#171c22}.name{font-weight:700}.meta{font-size:12px;color:#aab2bd;margin-top:3px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.badge{font-size:11px;border:1px solid #39424d;border-radius:999px;padding:3px 6px;color:#c8d0da}.status{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:3px 5px;margin-right:6px}.continuous{background:#43a047}.scheduled{background:#fb8c00}.mixed{background:#7e57c2}.event_based,.seasonal{background:#1e88e5}.detail h2{margin:0 0 4px}.links a{display:inline-block;margin:4px 8px 4px 0;color:#8ab4f8}.notice{font-size:12px;color:#f2bd66;background:#2a2317;border:1px solid #5f4a24;padding:9px;border-radius:8px;margin-top:10px}.legend{position:absolute;z-index:1000;left:10px;bottom:10px;background:#111b;padding:9px;border:1px solid #333;border-radius:8px;font-size:11px}
@media(max-width:900px){header{height:auto;padding:10px;flex-wrap:wrap}header input{order:2;min-width:100%}.layout{display:block;height:calc(100vh - 126px);position:relative}.sidebar{display:none}.detail{position:absolute;left:0;right:0;bottom:0;max-height:42%;border-left:0;border-top:1px solid #303640;z-index:1100;border-radius:18px 18px 0 0}#map{height:100%}}
</style></head><body>
<header><b>LIVE MUSIC MAP</b><input id="q" placeholder="配信元・都市・国・ジャンルで検索"></header>
<div class="toolbar"><button data-filter="all">すべて</button><button data-filter="festival">Festival</button><button data-filter="radio">Radio</button><button data-filter="independent_media">Independent</button><button data-filter="studio_media">Studio / Media</button></div>
<div class="layout"><aside class="sidebar"><div class="section"><b>配信元</b><div class="meta">source情報とstream情報を分離</div></div><div id="list"></div></aside><main style="position:relative"><div id="map"></div><div class="legend">緑 常時 / 橙 予定 / 紫 Mixed / 青 Event-based</div></main><aside class="detail"><div class="section" id="detail"><h2>配信元を選択</h2><div class="meta">ピンまたは左一覧をタップ</div></div></aside></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{worldCopyJump:true}).setView([28,10],2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
let sources=[],markers=[],currentFilter='all';const statusColor={continuous:'#43a047',scheduled:'#fb8c00',mixed:'#7e57c2',event_based:'#1e88e5',seasonal:'#1e88e5'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const badge=g=>`<span class="badge">${esc(g)}</span>`;
function show(s){document.getElementById('detail').innerHTML=`<h2>${esc(s.name)}</h2><div class="meta">${esc(s.location.label)} · ${esc(s.type)}</div><div style="margin-top:10px"><span class="status ${esc(s.status)}">${esc(s.status)}</span></div><div class="badges">${s.genres.map(badge).join('')}</div><h3>公式リンク</h3><div class="links"><a target="_blank" href="${s.official_site}">公式サイト</a><a target="_blank" href="${s.youtube_url}">YouTube</a><a target="_blank" href="${s.schedule_url}">Schedule</a></div><h3>位置</h3><div>${esc(s.location.label)}</div><div class="meta">precision: ${esc(s.location.precision)}</div><h3>扱うジャンル</h3><div>${s.genres.map(esc).join(' / ')}</div><div class="notice">これは配信元レベルのジャンル。個別配信のジャンル・出演者・会場は、確認できた場合だけstream側に持たせる。</div><h3>備考</h3><div>${esc(s.note)}</div>`}
function render(){markers.forEach(m=>map.removeLayer(m));markers=[];const q=document.getElementById('q').value.trim().toLowerCase();const subset=sources.filter(s=>{const blob=[s.name,s.country,s.region,s.city,s.type,...s.genres].join(' ').toLowerCase();return(!q||blob.includes(q))&&(currentFilter==='all'||s.type===currentFilter)});document.getElementById('list').innerHTML=subset.map(s=>`<div class="source" data-id="${s.id}"><div class="name"><span class="status ${s.status}">${s.status}</span>${esc(s.name)}</div><div class="meta">${esc(s.city)}, ${esc(s.country)} · ${esc(s.type)}</div><div class="badges">${s.genres.slice(0,5).map(badge).join('')}</div></div>`).join('');document.querySelectorAll('.source').forEach(el=>el.onclick=()=>show(sources.find(s=>s.id===el.dataset.id)));subset.forEach(s=>{const c=statusColor[s.status]||'#607d8b';const icon=L.divIcon({className:'',html:`<div style="width:22px;height:22px;background:${c};border:2px solid white;border-radius:50%;box-shadow:0 0 0 6px ${c}33"></div>`,iconSize:[22,22],iconAnchor:[11,11]});const m=L.marker([s.location.lat,s.location.lon],{icon}).addTo(map).on('click',()=>show(s));markers.push(m)})}
fetch('./data/sources.json').then(r=>r.json()).then(d=>{sources=d;render();show(sources[0])});document.getElementById('q').addEventListener('input',render);document.querySelectorAll('.toolbar button').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;render()});
</script></body></html>
