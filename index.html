<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Music Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#0b0d10;color:#f4f4f4}
button,select,input{font:inherit}
header{min-height:64px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #252932;background:#101318}
header b{font-size:18px;white-space:nowrap}
header input{flex:1;max-width:620px;background:#171b22;border:1px solid #2a303a;border-radius:10px;color:#fff;padding:11px 13px}
select{background:#171b22;border:1px solid #2a303a;border-radius:9px;color:#fff;padding:9px}
.toolbar{padding:10px 16px;display:flex;gap:8px;overflow:auto;border-bottom:1px solid #252932;background:#101318}
.toolbar button{background:#1a1f27;border:1px solid #2c333d;color:#ddd;border-radius:999px;padding:8px 11px;white-space:nowrap}
.toolbar button.active{background:#303846;color:#fff}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr) 390px;height:calc(100vh - 117px)}
.sidebar,.detail{overflow:auto;background:#11151a}
.sidebar{border-right:1px solid #252932}
.detail{border-left:1px solid #252932}
.center-pane{position:relative;min-width:0;min-height:0;background:#090b0e}
#mapView,#theaterView,#map{width:100%;height:100%}
#mapView[hidden],#theaterView[hidden]{display:none}
.section{padding:14px}
.source{padding:12px;border-bottom:1px solid #242a31;cursor:pointer}
.source:hover{background:#171c22}
.name{font-weight:700}
.meta{font-size:12px;color:#aab2bd;margin-top:3px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:11px;border:1px solid #39424d;border-radius:999px;padding:3px 6px;color:#c8d0da}
.status{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:3px 5px;margin-right:6px}
.status.live{background:#e53935}
.status.upcoming{background:#fb8c00}
.status.source{background:#546e7a}
.detail h2{margin:0 0 4px}
.links a{display:inline-block;margin:4px 8px 4px 0;color:#8ab4f8}
.links button{display:inline-block;margin:4px 8px 4px 0;background:#262d36;border:1px solid #46515e;border-radius:8px;color:#fff;padding:7px 10px;cursor:pointer}
.links button:hover{background:#323b47}
.notice{font-size:12px;color:#f2bd66;background:#2a2317;border:1px solid #5f4a24;padding:9px;border-radius:8px;margin-top:10px}
.stream{margin:12px 0;padding:11px;border:1px solid #303640;border-radius:10px;background:#171b22}
.stream h3{font-size:15px;margin:7px 0}
.stream iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;margin-top:10px;background:#000}
.stream-grid{display:grid;grid-template-columns:90px 1fr;gap:5px 8px;font-size:12px;margin-top:8px}
.stream-grid dt{color:#89939f}
.stream-grid dd{margin:0}
.legend{position:absolute;z-index:1000;left:10px;bottom:10px;background:#111d;padding:9px;border:1px solid #333;border-radius:8px;font-size:11px}
.acq{font-size:11px;margin-top:6px;color:#9da6b2}
.cluster-icon{display:grid;place-items:center;width:38px;height:38px;border:2px solid #fff;border-radius:50%;font-weight:800;font-size:12px;box-shadow:0 0 0 6px #0005,0 4px 14px #0008}
.cluster-live{background:#e53935}
.cluster-upcoming{background:#fb8c00}
.cluster-source{background:#607d8b}
.theater-shell{height:100%;display:flex;flex-direction:column;background:#0b0e13}
.theater-head{min-height:48px;display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid #252c36;background:#11161d}
.theater-title{min-width:0;flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theater-back{flex:0 0 auto;background:#242b34;border:1px solid #46515e;border-radius:8px;color:#fff;padding:7px 11px;cursor:pointer}
.theater-back:hover{background:#303946}
.theater-stage{flex:1;min-height:0;display:grid;place-items:center;padding:18px}
.theater-frame-wrap{width:min(100%,1280px);max-height:100%;aspect-ratio:16/9;background:#000;border:1px solid #252c36;border-radius:12px;overflow:hidden;box-shadow:0 16px 42px #0008}
.theater-frame-wrap iframe{display:block;width:100%;height:100%;border:0}
@media(max-width:900px){
  header{flex-wrap:wrap}
  header input{order:3;min-width:100%}
  .layout{display:block;height:calc(100vh - 168px);position:relative}
  .sidebar{display:none}
  .detail{position:absolute;left:0;right:0;bottom:0;max-height:48%;border-left:0;border-top:1px solid #303640;z-index:1100;border-radius:18px 18px 0 0}
  .center-pane{height:100%}
  .theater-stage{padding:8px 8px calc(48vh + 8px)}
}
</style>
</head>
<body>
<header>
  <b>LIVE MUSIC MAP</b>
  <input id="q" placeholder="配信元・都市・国・ジャンルで検索">
  <select id="tz" aria-label="Time zone"></select>
</header>
<div class="toolbar">
  <button class="active" data-filter="all">すべて</button>
  <button data-filter="live">LIVE</button>
  <button data-filter="upcoming">Upcoming</button>
  <button data-filter="festival">Festival</button>
  <button data-filter="radio">Radio</button>
  <button data-filter="independent_media">Independent</button>
  <button data-filter="studio_media">Studio / Media</button>
</div>
<div class="layout">
  <aside class="sidebar">
    <div class="section">
      <b>配信元</b>
      <div class="meta">LIVEを最優先、Upcomingは開始が近い順。音楽ライブ確認済みの配信だけ表示。</div>
      <div class="acq" id="acq"></div>
    </div>
    <div id="list"></div>
  </aside>
  <main class="center-pane">
    <div id="mapView">
      <div id="map"></div>
      <div class="legend">赤 LIVE / 橙 Upcoming / 灰 Sourceのみ · 数字は近接する配信元</div>
    </div>
    <div id="theaterView" hidden>
      <div class="theater-shell">
        <div class="theater-head">
          <div class="theater-title" id="theaterTitle">YouTube Live</div>
          <button class="theater-back" id="theaterBack" type="button">地図に戻る</button>
        </div>
        <div class="theater-stage">
          <div class="theater-frame-wrap">
            <iframe id="theaterFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen title="YouTube player"></iframe>
          </div>
        </div>
      </div>
    </div>
  </main>
  <aside class="detail">
    <div class="section" id="detail"><h2>配信元を選択</h2></div>
  </aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const map=L.map('map',{worldCopyJump:true}).setView([28,10],2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
const markerLayer=L.markerClusterGroup({showCoverageOnHover:false,spiderfyOnMaxZoom:true,removeOutsideVisibleBounds:true,maxClusterRadius:44,iconCreateFunction(cluster){const children=cluster.getAllChildMarkers();const state=children.some(m=>m.options.sourceState==='live')?'live':children.some(m=>m.options.sourceState==='upcoming')?'upcoming':'source';return L.divIcon({className:'',html:`<div class="cluster-icon cluster-${state}">${children.length}</div>`,iconSize:[38,38],iconAnchor:[19,19]})}}).addTo(map);
let sources=[],streams=[],acquisition={},currentFilter='all',selectedSource=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const badge=g=>`<span class="badge">${esc(g)}</span>`;
const sourceStreams=id=>streams.filter(s=>s.source_id===id&&s.music_live_status==='verified');
const stateFor=s=>sourceStreams(s.id).some(x=>x.status==='live')?'live':sourceStreams(s.id).some(x=>x.status==='upcoming')?'upcoming':'source';
const stateRank={live:0,upcoming:1,source:2};
function nextUpcoming(source){const times=sourceStreams(source.id).filter(s=>s.status==='upcoming').map(s=>Date.parse(s.scheduled_start)).filter(Number.isFinite);return times.length?Math.min(...times):Infinity}
function liveCount(source){return sourceStreams(source.id).filter(s=>s.status==='live').length}
function sourceOrder(a,b){const sa=stateFor(a),sb=stateFor(b);if(stateRank[sa]!==stateRank[sb])return stateRank[sa]-stateRank[sb];if(sa==='live'&&liveCount(a)!==liveCount(b))return liveCount(b)-liveCount(a);if(sa==='upcoming'&&nextUpcoming(a)!==nextUpcoming(b))return nextUpcoming(a)-nextUpcoming(b);return a.name.localeCompare(b.name)}
function orderedStreams(id){return sourceStreams(id).slice().sort((a,b)=>{const ar=a.status==='live'?0:1,br=b.status==='live'?0:1;if(ar!==br)return ar-br;if(a.status==='upcoming'&&b.status==='upcoming')return (Date.parse(a.scheduled_start)||Infinity)-(Date.parse(b.scheduled_start)||Infinity);return String(a.actual_start||a.scheduled_start||a.title).localeCompare(String(b.actual_start||b.scheduled_start||b.title))})}
const localZone=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';
const zones=[localZone,'UTC','Asia/Tokyo','Europe/Berlin','America/New_York','America/Los_Angeles','Australia/Sydney'].filter((v,i,a)=>a.indexOf(v)===i);
const tz=document.getElementById('tz');tz.innerHTML=zones.map(z=>`<option value="${esc(z)}">${esc(z===localZone?`Local · ${z}`:z)}</option>`).join('');
function formatTime(value){if(!value)return '未確認';try{return new Intl.DateTimeFormat(undefined,{timeZone:tz.value,dateStyle:'medium',timeStyle:'short'}).format(new Date(value))}catch{return value}}
function openTheater(videoId,title){if(!/^[A-Za-z0-9_-]{11}$/.test(videoId))return;document.getElementById('theaterTitle').textContent=title||'YouTube Live';document.getElementById('theaterFrame').src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}?autoplay=1`;document.getElementById('mapView').hidden=true;document.getElementById('theaterView').hidden=false}
function closeTheater(){document.getElementById('theaterView').hidden=true;document.getElementById('theaterFrame').src='';document.getElementById('mapView').hidden=false;requestAnimationFrame(()=>map.invalidateSize())}
function streamCard(s){const perf=s.performers?.length?s.performers.join(', '):'未確認';const venue=s.venue||'未確認';const genres=s.genres?.length?s.genres.join(' / '):'未確認';const canEmbed=s.youtube_video_id&&s.embed_allowed!==false;const embed=canEmbed?`<iframe loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(s.youtube_video_id)}"></iframe>`:'';const theaterButton=canEmbed?`<button type="button" data-theater-video="${esc(s.youtube_video_id)}" data-theater-title="${esc(s.title)}">シアター</button>`:'';return `<div class="stream"><span class="status ${esc(s.status)}">${esc(s.status.toUpperCase())}</span><h3>${esc(s.title)}</h3><div class="meta">${s.status==='live'?'開始':'予定'}: ${esc(formatTime(s.actual_start||s.scheduled_start))}${s.concurrent_viewers!=null?` · ${Number(s.concurrent_viewers).toLocaleString()} watching`:''}</div>${embed}<dl class="stream-grid"><dt>配信種別</dt><dd>${esc(s.content_type||'未確認')}</dd><dt>出演者</dt><dd>${esc(perf)}</dd><dt>会場</dt><dd>${esc(venue)}</dd><dt>ジャンル</dt><dd>${esc(genres)}</dd></dl><div class="links">${theaterButton}<a target="_blank" rel="noopener" href="${esc(s.youtube_url)}">YouTubeで開く</a></div></div>`}
function show(s){if(!s)return;selectedSource=s;const ss=orderedStreams(s.id);const streamHtml=ss.length?ss.map(streamCard).join(''):`<div class="notice">現在、音楽ライブとして確認済みのLIVE / Upcomingはありません。</div>`;const locationLabel=s.location?.label||[s.city,s.country].filter(Boolean).join(', ')||'未確認';const locationPrecision=s.location?.precision||'unknown';document.getElementById('detail').innerHTML=`<h2>${esc(s.name)}</h2><div class="meta">${esc(locationLabel)} · ${esc(s.type)}</div><div class="badges">${(s.genres||[]).map(badge).join('')}</div><h3>現在 / 近日</h3>${streamHtml}<h3>公式リンク</h3><div class="links">${s.official_site?`<a target="_blank" rel="noopener" href="${esc(s.official_site)}">公式サイト</a>`:''}${s.youtube_url?`<a target="_blank" rel="noopener" href="${esc(s.youtube_url)}">YouTube</a>`:''}${s.schedule_url?`<a target="_blank" rel="noopener" href="${esc(s.schedule_url)}">Schedule</a>`:''}</div><h3>位置</h3><div>${esc(locationLabel)}</div><div class="meta">precision: ${esc(locationPrecision)}</div><h3>配信元が扱うジャンル</h3><div>${(s.genres||[]).map(esc).join(' / ')||'未確認'}</div><h3>配信形式</h3><div>${(s.formats||[]).map(esc).join(' / ')||'未確認'}</div><div class="notice">配信元レベルのジャンルを個別streamへコピーしません。出演者・会場・streamジャンルも確認できた場合だけ表示します。</div><h3>備考</h3><div>${esc(s.note||'')}</div>`}
function sourceIcon(state){const color=state==='live'?'#e53935':state==='upcoming'?'#fb8c00':'#607d8b';return L.divIcon({className:'',html:`<div style="width:22px;height:22px;background:${color};border:2px solid white;border-radius:50%;box-shadow:0 0 0 6px ${color}33"></div>`,iconSize:[22,22],iconAnchor:[11,11]})}
function render(){markerLayer.clearLayers();const q=document.getElementById('q').value.trim().toLowerCase();const subset=sources.filter(s=>{const blob=[s.name,s.country,s.region,s.city,s.type,...(s.genres||[]),...(s.formats||[])].join(' ').toLowerCase();const state=stateFor(s);const okState=currentFilter==='live'||currentFilter==='upcoming'?state===currentFilter:true;const okType=['festival','radio','independent_media','studio_media'].includes(currentFilter)?s.type===currentFilter:true;return(!q||blob.includes(q))&&okState&&okType}).sort(sourceOrder);document.getElementById('list').innerHTML=subset.map(s=>{const st=stateFor(s);const upcoming=orderedStreams(s.id).find(x=>x.status==='upcoming');const next=st==='upcoming'&&upcoming?` · ${formatTime(upcoming.scheduled_start)}`:'';return `<div class="source" data-id="${esc(s.id)}"><div class="name"><span class="status ${st}">${st==='source'?'SOURCE':st.toUpperCase()}</span>${esc(s.name)}</div><div class="meta">${esc(s.city||'')}${s.city&&s.country?', ':''}${esc(s.country||'')} · ${esc(s.type)}${esc(next)}</div><div class="badges">${(s.genres||[]).slice(0,5).map(badge).join('')}</div></div>`}).join('');document.querySelectorAll('.source').forEach(el=>{el.onclick=()=>show(sources.find(s=>s.id===el.dataset.id))});const points=[];for(const s of subset){const lat=Number(s.location?.lat),lon=Number(s.location?.lon);if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;const st=stateFor(s);points.push(L.marker([lat,lon],{icon:sourceIcon(st),sourceState:st,title:s.name}).on('click',()=>show(s)))}markerLayer.addLayers(points);return subset}
Promise.all([fetch('./data/sources.json').then(r=>r.json()),fetch('./data/streams.json').then(r=>r.json()),fetch('./data/acquisition.json').then(r=>r.json())]).then(([a,b,c])=>{sources=a;streams=b;acquisition=c;const verified=streams.filter(s=>s.music_live_status==='verified').length;document.getElementById('acq').textContent=acquisition?.youtube?.configured?`YouTube自動取得: 有効 · 音楽LIVE候補 ${verified}件`:'YouTube自動取得: APIキー未設定';const ordered=render();if(ordered[0])show(ordered[0])});
document.getElementById('q').addEventListener('input',render);
tz.addEventListener('change',()=>{if(selectedSource)show(selectedSource);render()});
document.querySelectorAll('.toolbar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.toolbar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;const ordered=render();if(ordered.length&&!ordered.includes(selectedSource))show(ordered[0])});
document.addEventListener('click',e=>{const button=e.target.closest('[data-theater-video]');if(button)openTheater(button.dataset.theaterVideo,button.dataset.theaterTitle)});
document.getElementById('theaterBack').addEventListener('click',closeTheater);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('theaterView').hidden)closeTheater()});
</script>
</body>
</html>
