<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Music Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="./map-location-ui.css">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0d10;color:#f4f4f4}
body{overflow:hidden}
button,select,input{font:inherit}
button{cursor:pointer}
header{min-height:64px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #252932;background:#101318}
.brand{font-size:18px;font-weight:800;white-space:nowrap;letter-spacing:.01em}
header input{flex:1;max-width:620px;background:#171b22;border:1px solid #2a303a;border-radius:10px;color:#fff;padding:11px 13px}
select{background:#171b22;border:1px solid #2a303a;border-radius:9px;color:#fff;padding:9px}
.toolbar{padding:10px 16px;display:flex;gap:8px;overflow:auto;border-bottom:1px solid #252932;background:#101318;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.toolbar button{background:#1a1f27;border:1px solid #2c333d;color:#ddd;border-radius:999px;padding:8px 11px;white-space:nowrap}
.toolbar button.active{background:#303846;color:#fff}
.filter-count{font-weight:750}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr) 390px;height:calc(100vh - 117px);height:calc(100dvh - 117px)}
.sidebar,.detail{overflow:auto;background:#11151a}
.sidebar{border-right:1px solid #252932}
.detail{border-left:1px solid #252932}
.center-pane{position:relative;min-width:0;min-height:0;background:#090b0e}
#map{width:100%;height:100%}
.section{padding:14px}
.source{padding:12px;border-bottom:1px solid #242a31;cursor:pointer}
.source:hover{background:#171c22}
.name{font-weight:700}
.meta{font-size:12px;color:#aab2bd;margin-top:3px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:11px;border:1px solid #39424d;border-radius:999px;padding:3px 6px;color:#c8d0da}
.status{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:3px 5px;margin-right:6px}
.status.live{background:#e53935}
.status.upcoming{background:#fb8c00}
.status.source{background:#546e7a}
.detail h2{margin:0 0 4px}
.detail h3{margin:18px 0 8px}
.links{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.links a{display:inline-block;margin:4px 0;color:#8ab4f8}
.links button{display:inline-block;margin:4px 0;background:#262d36;border:1px solid #46515e;border-radius:8px;color:#fff;padding:7px 10px}
.links button:hover{background:#323b47}
.notice{font-size:12px;color:#f2bd66;background:#2a2317;border:1px solid #5f4a24;padding:9px;border-radius:8px;margin-top:10px}
.stream{margin:10px 0;padding:11px;border:1px solid #303640;border-radius:10px;background:#171b22}
.stream.live-card{border-color:#5a3434}
.stream.upcoming-card{padding:10px}
.stream h3{font-size:15px;margin:7px 0}
.stream iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;margin-top:10px;background:#000}
.stream-grid{display:grid;grid-template-columns:90px 1fr;gap:5px 8px;font-size:12px;margin-top:8px}
.stream-grid dt{color:#89939f}
.stream-grid dd{margin:0}
.legend{position:absolute;z-index:1000;left:10px;bottom:10px;background:#111d;padding:9px;border:1px solid #333;border-radius:8px;font-size:11px;max-width:min(720px,calc(100% - 20px));line-height:1.55}
.acq{font-size:11px;margin-top:6px;color:#9da6b2}
.cluster-wrap{position:relative;width:58px;height:58px;display:grid;place-items:center}
.cluster-core{display:grid;place-items:center;width:38px;height:38px;background:#59636f;border:2px solid #d8dde3;border-radius:50%;font-weight:850;font-size:12px;color:#fff;box-shadow:0 4px 14px #0009}
.cluster-wrap.has-live .cluster-core{border-color:#ff8b87;box-shadow:0 0 0 4px #e53935,0 0 0 9px #e5393538,0 0 22px #e53935aa,0 4px 14px #0009;animation:cluster-live-pulse 1.8s ease-in-out infinite}
.cluster-wrap.has-upcoming .cluster-core{border-color:#ffd08a;box-shadow:0 0 0 4px #fb8c00,0 0 0 8px #fb8c0030,0 4px 14px #0009}
.cluster-state-badge{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;border-radius:999px;padding:2px 5px;font-size:8px;font-weight:900;line-height:1.15;color:#fff;border:1px solid #fff8;box-shadow:0 2px 8px #000b}
.cluster-live-badge{top:-7px;background:#e53935}
.cluster-up-badge{bottom:-7px;background:#fb8c00}
@keyframes cluster-live-pulse{0%,100%{filter:drop-shadow(0 0 0 #e5393500)}50%{filter:drop-shadow(0 0 7px #e53935cc)}}
.source-info{padding:2px 0 4px}
.source-info-row{margin:10px 0}
.source-info-label{font-size:11px;color:#89939f;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.upcoming-more{margin-top:8px;border:1px solid #303640;border-radius:10px;background:#14181e}
.upcoming-more summary{cursor:pointer;padding:10px 12px;color:#cdd5df;font-size:13px}
.upcoming-more[open] summary{border-bottom:1px solid #303640}
.upcoming-more .more-body{padding:0 10px 8px}
.player-layer{position:fixed;z-index:4000;left:50%;top:52%;transform:translate(-50%,-50%);width:min(960px,62vw);min-width:520px;max-width:calc(100vw - 48px);background:#0c0f14;border:1px solid #3a424e;border-radius:12px;box-shadow:0 22px 70px #000d;overflow:hidden;resize:both}
.player-layer[hidden]{display:none}
.player-head{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#151a21;border-bottom:1px solid #2d343e;cursor:move;user-select:none}
.player-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:13px}
.player-close{border:1px solid #46515e;background:#252c35;color:#fff;border-radius:7px;padding:5px 9px}
.player-body{aspect-ratio:16/9;min-height:292px;background:#000}
.player-body iframe{display:block;width:100%;height:100%;border:0}
.player-meta{display:none}
.sheet-handle,.sheet-close,.sheet-expand{display:none}

@media(max-width:900px){
  body{overscroll-behavior:none}
  header{min-height:104px;height:104px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:44px 44px;gap:6px 10px;padding:8px 10px;background:#101318}
  .brand{font-size:17px;align-self:center}
  #tz{grid-column:2;grid-row:1;width:auto;max-width:118px;height:38px;padding:7px 28px 7px 10px;border-radius:10px;font-size:13px}
  header input{grid-column:1/-1;grid-row:2;order:initial;min-width:0;width:100%;max-width:none;height:44px;padding:10px 12px;border-radius:10px}
  .toolbar{height:48px;padding:5px 8px;gap:7px;align-items:center;overscroll-behavior-x:contain}
  .toolbar button{height:36px;padding:7px 11px;font-size:14px}
  .toolbar .category-filter{display:none}
  .layout{display:block;height:calc(100vh - 152px);height:calc(100dvh - 152px);position:relative}
  .sidebar{display:none}
  .center-pane{height:100%}
  .legend{display:none}
  .detail{display:block;position:absolute;left:0;right:0;bottom:0;height:0;max-height:none;overflow:hidden;border:0;border-top:1px solid #303640;z-index:1200;border-radius:18px 18px 0 0;background:#11151af5;box-shadow:0 -16px 40px #0009;transform:translateY(100%);transition:transform .22s ease,height .22s ease;padding-bottom:env(safe-area-inset-bottom)}
  .detail.open{height:174px;transform:translateY(0)}
  .detail.expanded{height:min(72dvh,640px);overflow:auto}
  .detail .section{padding:24px 14px 16px}
  .detail h2{padding-right:34px;font-size:22px}
  .detail h3{font-size:15px;margin:15px 0 8px}
  .detail .stream{margin:8px 0;padding:10px}
  .detail .stream iframe{display:none}
  .detail .source-info,.detail .desktop-only-detail{display:none}
  .detail.expanded .source-info,.detail.expanded .desktop-only-detail{display:block}
  .detail.expanded .mobile-peek-only{display:none}
  .sheet-handle{display:block;position:absolute;top:8px;left:50%;transform:translateX(-50%);width:44px;height:5px;border-radius:999px;background:#727985;border:0;padding:0}
  .sheet-close{display:block;position:absolute;top:14px;right:12px;width:32px;height:32px;border-radius:50%;border:1px solid #3a424e;background:#1a2028;color:#fff;font-size:18px;line-height:28px;z-index:2}
  .sheet-expand{display:inline-flex;align-items:center;justify-content:center;border:1px solid #46515e;background:#262d36;color:#fff;border-radius:9px;padding:8px 11px;margin-top:8px}
  .mobile-primary-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .mobile-primary-actions button,.mobile-primary-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:38px;border-radius:9px;padding:8px 11px;text-decoration:none}
  .mobile-primary-actions button{background:#fff;color:#0d1117;border:1px solid #fff;font-weight:800}
  .mobile-primary-actions a{background:#242b34;color:#dce5ef;border:1px solid #46515e}
  .mobile-stream-title{font-size:13px;color:#dfe5ec;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .player-layer{inset:0;left:0;top:0;transform:none;width:100vw;height:100vh;height:100dvh;min-width:0;max-width:none;border:0;border-radius:0;resize:none;display:flex;flex-direction:column;background:#090b0e}
  .player-layer[hidden]{display:none}
  .player-head{height:54px;padding:8px 10px;cursor:default;flex:0 0 auto}
  .player-close{order:-1;background:transparent;border:0;padding:7px 6px;color:#dfe5ec;font-weight:700}
  .player-title{font-size:13px}
  .player-body{width:100%;min-height:0;aspect-ratio:16/9;flex:0 0 auto;margin-top:max(0px,env(safe-area-inset-top))}
  .player-meta{display:block;padding:16px;overflow:auto}
  .player-meta .links{margin-top:12px}
  .player-meta a{color:#8ab4f8}
}
</style>
</head>
<body>
<header>
  <div class="brand">LIVE MUSIC MAP</div>
  <input id="q" placeholder="配信元・都市・国・ジャンルで検索" aria-label="検索">
  <select id="tz" aria-label="Time zone"></select>
</header>
<div class="toolbar" aria-label="状態と配信元タイプのフィルタ">
  <button class="active" data-filter="all">すべて <span class="filter-count" data-count="all"></span></button>
  <button data-filter="live">LIVE <span class="filter-count" data-count="live"></span></button>
  <button data-filter="upcoming">Upcoming <span class="filter-count" data-count="upcoming"></span></button>
  <button data-filter="source">ソースのみ <span class="filter-count" data-count="source"></span></button>
  <button class="category-filter" data-filter="festival">Festival</button>
  <button class="category-filter" data-filter="radio">Radio</button>
  <button class="category-filter" data-filter="independent_media">Independent</button>
  <button class="category-filter" data-filter="studio_media">Studio / Media</button>
</div>
<div class="layout">
  <aside class="sidebar">
    <div class="section">
      <b>配信元</b>
      <div class="meta">LIVEを最優先、Upcomingは開始が近い順。音楽ライブ確認済みの配信だけ表示。</div>
      <div class="acq" id="acq"></div>
      <div id="locationCounts"></div>
    </div>
    <div id="list"></div>
  </aside>
  <main class="center-pane">
    <div id="map"></div>
    <div class="legend">状態: 赤 LIVE / 橙 Upcoming / 灰 Sourceのみ · 位置: ○ 実際の会場・配信地点 / ◇ 配信元拠点 / 点線「国」 国レベル参考位置 · 不明は地図非表示 · クラスタ中央=配信元総数</div>
  </main>
  <aside class="detail" id="detailPanel">
    <button class="sheet-handle" id="sheetHandle" type="button" aria-label="詳細を開閉"></button>
    <button class="sheet-close" id="sheetClose" type="button" aria-label="詳細を閉じる">×</button>
    <div class="section" id="detail"><h2>配信元を選択</h2></div>
  </aside>
</div>
<div class="player-layer" id="playerLayer" hidden>
  <div class="player-head" id="playerDragHandle">
    <div class="player-title" id="playerTitle">YouTube Live</div>
    <button class="player-close" id="playerClose" type="button">閉じる</button>
  </div>
  <div class="player-body"><iframe id="playerFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen title="YouTube player"></iframe></div>
  <div class="player-meta" id="playerMeta"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="./country-reference-points.js"></script>
<script src="./location-ui.js"></script>
<script>
const mobileQuery=window.matchMedia('(max-width:900px)');
const isMobile=()=>mobileQuery.matches;
const map=L.map('map',{worldCopyJump:true,maxZoom:9}).setView([28,10],2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:9}).addTo(map);
const markerLayer=L.markerClusterGroup({showCoverageOnHover:false,spiderfyOnMaxZoom:true,removeOutsideVisibleBounds:true,maxClusterRadius:44,iconCreateFunction(cluster){const children=cluster.getAllChildMarkers();const total=children.length;const live=children.filter(m=>m.options.sourceState==='live').length;const upcoming=children.filter(m=>m.options.sourceState==='upcoming').length;const state=live>0?'has-live':upcoming>0?'has-upcoming':'source-only';const liveBadge=live?`<span class="cluster-state-badge cluster-live-badge">LIVE ${live}</span>`:'';const upBadge=upcoming?`<span class="cluster-state-badge cluster-up-badge">UP ${upcoming}</span>`:'';return L.divIcon({className:'',html:`<div class="cluster-wrap ${state}" title="${total} sources · LIVE ${live} · Upcoming ${upcoming}"><div class="cluster-core">${total}</div>${liveBadge}${upBadge}</div>`,iconSize:[58,58],iconAnchor:[29,29]})}}).addTo(map);
let sources=[],streams=[],acquisition={},currentFilter='all',selectedSource=null;
const locationUI=window.LiveMusicMapLocationUI;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const badge=g=>`<span class="badge">${esc(g)}</span>`;
const sourceStreams=id=>streams.filter(s=>s.source_id===id&&s.music_live_status==='verified');
const stateFor=s=>sourceStreams(s.id).some(x=>x.status==='live')?'live':sourceStreams(s.id).some(x=>x.status==='upcoming')?'upcoming':'source';
const stateRank={live:0,upcoming:1,source:2};
function nextUpcoming(source){const times=sourceStreams(source.id).filter(s=>s.status==='upcoming').map(s=>Date.parse(s.scheduled_start)).filter(Number.isFinite);return times.length?Math.min(...times):Infinity}
function liveCount(source){return sourceStreams(source.id).filter(s=>s.status==='live').length}
function sourceOrder(a,b){const sa=stateFor(a),sb=stateFor(b);if(stateRank[sa]!==stateRank[sb])return stateRank[sa]-stateRank[sb];if(sa==='live'&&liveCount(a)!==liveCount(b))return liveCount(b)-liveCount(a);if(sa==='upcoming'&&nextUpcoming(a)!==nextUpcoming(b))return nextUpcoming(a)-nextUpcoming(b);return a.name.localeCompare(b.name)}
function orderedStreams(id){return sourceStreams(id).slice().sort((a,b)=>{const ar=a.status==='live'?0:1,br=b.status==='live'?0:1;if(ar!==br)return ar-br;if(a.status==='upcoming'&&b.status==='upcoming')return (Date.parse(a.scheduled_start)||Infinity)-(Date.parse(b.scheduled_start)||Infinity);return String(a.actual_start||a.scheduled_start||a.title).localeCompare(String(b.actual_start||b.scheduled_start||b.title))})}
const localZone=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';
const zones=[localZone,'UTC','Asia/Tokyo','Europe/Berlin','America/New_York','America/Los_Angeles','Australia/Sydney'].filter((v,i,a)=>a.indexOf(v)===i);
const zoneLabels={'Asia/Tokyo':'JST','UTC':'UTC','Europe/Berlin':'Berlin','America/New_York':'New York','America/Los_Angeles':'Los Angeles','Australia/Sydney':'Sydney'};
const tz=document.getElementById('tz');
tz.innerHTML=zones.map(z=>`<option value="${esc(z)}">${esc(z===localZone?`Local · ${zoneLabels[z]||z}`:(zoneLabels[z]||z))}</option>`).join('');
function formatTime(value){if(!value)return '未確認';try{return new Intl.DateTimeFormat(undefined,{timeZone:tz.value,dateStyle:'medium',timeStyle:'short'}).format(new Date(value))}catch{return value}}
function openPlayer(videoId,title,youtubeUrl){if(!/^[A-Za-z0-9_-]{11}$/.test(videoId))return;const layer=document.getElementById('playerLayer');document.getElementById('playerTitle').textContent=title||'YouTube Live';document.getElementById('playerFrame').src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}?autoplay=1`;document.getElementById('playerClose').textContent=isMobile()?'← 地図へ戻る':'閉じる';document.getElementById('playerMeta').innerHTML=`<div class="name">${esc(title||'YouTube Live')}</div>${youtubeUrl?`<div class="links"><a target="_blank" rel="noopener" href="${esc(youtubeUrl)}">YouTubeで開く</a></div>`:''}`;layer.hidden=false}
function closePlayer(){const layer=document.getElementById('playerLayer');layer.hidden=true;document.getElementById('playerFrame').src=''}
function streamCard(s,{embed=false,compact=false}={}){const perf=s.performers?.length?s.performers.join(', '):'未確認';const venue=s.venue||'未確認';const genres=s.genres?.length?s.genres.join(' / '):'未確認';const canEmbed=s.youtube_video_id&&s.embed_allowed!==false;const inlineEmbed=embed&&canEmbed&&!isMobile()?`<iframe loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(s.youtube_video_id)}"></iframe>`:'';const playerButton=canEmbed&&s.status==='live'?`<button type="button" data-player-video="${esc(s.youtube_video_id)}" data-player-title="${esc(s.title)}" data-player-url="${esc(s.youtube_url)}">${isMobile()?'再生':'シアター'}</button>`:'';const details=compact?'':`<dl class="stream-grid"><dt>配信種別</dt><dd>${esc(s.content_type||'未確認')}</dd><dt>出演者</dt><dd>${esc(perf)}</dd><dt>会場</dt><dd>${esc(venue)}</dd><dt>ジャンル</dt><dd>${esc(genres)}</dd></dl>`;return `<div class="stream ${s.status==='live'?'live-card':'upcoming-card'}"><span class="status ${esc(s.status)}">${esc(s.status.toUpperCase())}</span><h3>${esc(s.title)}</h3><div class="meta">${s.status==='live'?'開始':'予定'}: ${esc(formatTime(s.actual_start||s.scheduled_start))}${s.concurrent_viewers!=null?` · ${Number(s.concurrent_viewers).toLocaleString()} watching`:''}</div>${inlineEmbed}${details}<div class="links">${playerButton}<a target="_blank" rel="noopener" href="${esc(s.youtube_url)}">${s.status==='live'?'YouTubeで開く':'チャンネルで確認'}</a></div></div>`}
function sourceInfoHtml(s,locationLabel){const kind=locationUI.classify(s);const notice=locationUI.notice(s);return `<div class="source-info"><div class="source-info-row"><div class="source-info-label">公式リンク</div><div class="links">${s.official_site?`<a target="_blank" rel="noopener" href="${esc(s.official_site)}">公式サイト</a>`:''}${s.youtube_url?`<a target="_blank" rel="noopener" href="${esc(s.youtube_url)}">YouTube</a>`:''}${s.schedule_url?`<a target="_blank" rel="noopener" href="${esc(s.schedule_url)}">Schedule</a>`:''}</div></div><div class="source-info-row"><div class="source-info-label">位置</div><div>${esc(locationLabel)}</div><div class="meta">位置区分: ${esc(locationUI.label(kind))}</div>${notice?`<div class="location-notice">${esc(notice)}</div>`:''}</div><div class="source-info-row"><div class="source-info-label">配信元が扱うジャンル</div><div>${(s.genres||[]).map(esc).join(' / ')||'未確認'}</div></div><div class="source-info-row"><div class="source-info-label">配信形式</div><div>${(s.formats||[]).map(esc).join(' / ')||'未確認'}</div></div>${s.note?`<div class="source-info-row"><div class="source-info-label">備考</div><div>${esc(s.note)}</div></div>`:''}</div>`}
function mobilePeekHtml(s,live,upcoming){const firstLive=live[0];const firstUpcoming=upcoming[0];const state=firstLive?'live':firstUpcoming?'upcoming':'source';const stream=firstLive||firstUpcoming;const canPlay=firstLive?.youtube_video_id&&firstLive.embed_allowed!==false;return `<div class="mobile-peek-only"><div class="meta"><span class="status ${state}">${state==='source'?'SOURCE':state.toUpperCase()}</span>${stream?`${state==='live'?'開始':'予定'}: ${esc(formatTime(stream.actual_start||stream.scheduled_start))}`:'現在の配信予定はありません'}</div>${stream?`<div class="mobile-stream-title">${esc(stream.title)}</div>`:''}<div class="mobile-primary-actions">${canPlay?`<button type="button" data-player-video="${esc(firstLive.youtube_video_id)}" data-player-title="${esc(firstLive.title)}" data-player-url="${esc(firstLive.youtube_url)}">再生</button>`:''}${stream?.youtube_url?`<a target="_blank" rel="noopener" href="${esc(stream.youtube_url)}">外部で開く</a>`:''}</div><button class="sheet-expand" type="button" data-sheet-expand>詳細を見る</button></div>`}
function setSheet(open,expanded=false){const panel=document.getElementById('detailPanel');panel.classList.toggle('open',open);panel.classList.toggle('expanded',open&&expanded);setTimeout(()=>map.invalidateSize(),230)}
function closeSheet(){selectedSource=null;setSheet(false,false)}
function show(s,{expand=false,fromMap=false}={}){if(!s)return;selectedSource=s;const ss=orderedStreams(s.id);const live=ss.filter(x=>x.status==='live');const upcoming=ss.filter(x=>x.status==='upcoming');const locationLabel=s.location?.label||[s.city,s.country].filter(Boolean).join(', ')||'不明';const liveHtml=live.length?live.map(x=>streamCard(x,{embed:true})).join(''):`<div class="meta">現在LIVEはありません。</div>`;const firstUpcoming=upcoming.slice(0,2);const restUpcoming=upcoming.slice(2);const upcomingHtml=upcoming.length?`${firstUpcoming.map(x=>streamCard(x,{compact:true})).join('')}${restUpcoming.length?`<details class="upcoming-more"><summary>ほか ${restUpcoming.length}件のUpcoming</summary><div class="more-body">${restUpcoming.map(x=>streamCard(x,{compact:true})).join('')}</div></details>`:''}`:`<div class="meta">Upcomingはありません。</div>`;document.getElementById('detail').innerHTML=`<h2>${esc(s.name)}</h2><div class="meta">${esc(locationLabel)} · ${esc(s.type)}</div><div class="badges">${(s.genres||[]).map(badge).join('')}</div>${isMobile()?mobilePeekHtml(s,live,upcoming):''}<div class="desktop-only-detail"><h3>LIVE</h3>${liveHtml}<h3>配信元情報</h3>${sourceInfoHtml(s,locationLabel)}<h3>Upcoming</h3>${upcomingHtml}</div>`;if(isMobile()){setSheet(true,expand);if(fromMap)setTimeout(()=>map.panBy([0,Math.min(150,Math.round(window.innerHeight*.16))],{animate:true}),40)}}
function sourceIcon(state,kind){const color=state==='live'?'#e53935':state==='upcoming'?'#fb8c00':'#607d8b';const shape=kind==='base'?'location-base':kind==='country'?'location-country':'location-actual';return L.divIcon({className:'',html:`<div class="map-pin ${shape}" style="--pin-color:${color}"></div>`,iconSize:[24,24],iconAnchor:[12,12]})}
function renderLocationCounts(){const c=locationUI.counts(sources);const total=sources.length;document.getElementById('locationCounts').innerHTML=`<div class="map-location-counts"><b>配信元</b><b>${total.toLocaleString()}</b><span>実際の会場・配信地点</span><span>${c.actual.toLocaleString()}</span><span>配信元拠点</span><span>${c.base.toLocaleString()}</span><span>国レベル</span><span>${c.country.toLocaleString()}</span><span>不明</span><span>${c.unknown.toLocaleString()}</span></div>`}
function renderFilterCounts(){const counts={all:sources.length,live:0,upcoming:0,source:0};for(const s of sources)counts[stateFor(s)]++;for(const [key,value] of Object.entries(counts)){const el=document.querySelector(`[data-count="${key}"]`);if(el)el.textContent=value.toLocaleString()}}
function filteredSources(){const q=document.getElementById('q').value.trim().toLowerCase();return sources.filter(s=>{const blob=[s.name,s.country,s.region,s.city,s.type,...(s.genres||[]),...(s.formats||[])].join(' ').toLowerCase();const state=stateFor(s);const okState=['live','upcoming','source'].includes(currentFilter)?state===currentFilter:true;const okType=['festival','radio','independent_media','studio_media'].includes(currentFilter)?s.type===currentFilter:true;return(!q||blob.includes(q))&&okState&&okType}).sort(sourceOrder)}
function render(){markerLayer.clearLayers();const subset=filteredSources();document.getElementById('list').innerHTML=subset.map(s=>{const st=stateFor(s);const upcoming=orderedStreams(s.id).find(x=>x.status==='upcoming');const next=st==='upcoming'&&upcoming?` · ${formatTime(upcoming.scheduled_start)}`:'';return `<div class="source" data-id="${esc(s.id)}"><div class="name"><span class="status ${st}">${st==='source'?'SOURCE':st.toUpperCase()}</span>${esc(s.name)}</div><div class="meta">${esc(s.city||'')}${s.city&&s.country?', ':''}${esc(s.country||'')} · ${esc(s.type)}${esc(next)}</div><div class="badges">${(s.genres||[]).slice(0,5).map(badge).join('')}</div></div>`}).join('');document.querySelectorAll('.source').forEach(el=>{el.onclick=()=>show(sources.find(s=>s.id===el.dataset.id),{expand:isMobile()})});const points=[];for(const s of subset){const point=locationUI.mapPoint(s);if(!point)continue;const st=stateFor(s);points.push(L.marker([point.lat,point.lon],{icon:sourceIcon(st,point.kind),sourceState:st,title:s.name}).on('click',()=>show(s,{fromMap:true})))}markerLayer.addLayers(points);return subset}
Promise.all([fetch('./data/sources.json').then(r=>r.json()),fetch('./data/streams.json').then(r=>r.json()),fetch('./data/acquisition.json').then(r=>r.json())]).then(([a,b,c])=>{sources=a;streams=b;acquisition=c;const verified=streams.filter(s=>s.music_live_status==='verified').length;document.getElementById('acq').textContent=acquisition?.youtube?.configured?`YouTube自動取得: 有効 · 音楽LIVE候補 ${verified}件`:'YouTube自動取得: APIキー未設定';renderLocationCounts();renderFilterCounts();const ordered=render();if(ordered[0]&&!isMobile())show(ordered[0])});
document.getElementById('q').addEventListener('input',()=>{const ordered=render();if(isMobile()&&selectedSource&&!ordered.includes(selectedSource))closeSheet()});
tz.addEventListener('change',()=>{if(selectedSource)show(selectedSource,{expand:document.getElementById('detailPanel').classList.contains('expanded')});render()});
document.querySelectorAll('.toolbar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.toolbar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;const ordered=render();if(isMobile()){if(selectedSource&&!ordered.includes(selectedSource))closeSheet()}else if(ordered.length&&!ordered.includes(selectedSource))show(ordered[0])});
document.addEventListener('click',e=>{const player=e.target.closest('[data-player-video]');if(player){openPlayer(player.dataset.playerVideo,player.dataset.playerTitle,player.dataset.playerUrl);return}if(e.target.closest('[data-sheet-expand]'))setSheet(true,true)});
document.getElementById('sheetClose').addEventListener('click',closeSheet);
document.getElementById('sheetHandle').addEventListener('click',()=>{const panel=document.getElementById('detailPanel');if(!panel.classList.contains('open'))return;setSheet(true,!panel.classList.contains('expanded'))});
document.getElementById('playerClose').addEventListener('click',closePlayer);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('playerLayer').hidden)closePlayer();else if(e.key==='Escape'&&isMobile()&&document.getElementById('detailPanel').classList.contains('open'))closeSheet()});
(function makeSheetSwipeable(){const panel=document.getElementById('detailPanel');const handle=document.getElementById('sheetHandle');let startY=null;handle.addEventListener('pointerdown',e=>{startY=e.clientY;handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointerup',e=>{if(startY==null)return;const dy=e.clientY-startY;startY=null;if(dy<-35)setSheet(true,true);else if(dy>55&&panel.classList.contains('expanded'))setSheet(true,false);else if(dy>55)closeSheet()});handle.addEventListener('pointercancel',()=>{startY=null})})();
(function makePlayerDraggable(){const layer=document.getElementById('playerLayer');const handle=document.getElementById('playerDragHandle');let drag=null;handle.addEventListener('pointerdown',e=>{if(isMobile()||e.target.closest('button'))return;const rect=layer.getBoundingClientRect();drag={dx:e.clientX-rect.left,dy:e.clientY-rect.top};layer.style.transform='none';layer.style.left=`${rect.left}px`;layer.style.top=`${rect.top}px`;handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!drag)return;const maxX=Math.max(0,window.innerWidth-layer.offsetWidth);const maxY=Math.max(0,window.innerHeight-layer.offsetHeight);layer.style.left=`${Math.min(maxX,Math.max(0,e.clientX-drag.dx))}px`;layer.style.top=`${Math.min(maxY,Math.max(0,e.clientY-drag.dy))}px`});handle.addEventListener('pointerup',()=>{drag=null});handle.addEventListener('pointercancel',()=>{drag=null})})();
mobileQuery.addEventListener('change',()=>{closePlayer();if(isMobile()){selectedSource=null;setSheet(false,false)}else{const ordered=filteredSources();if(ordered[0])show(selectedSource&&ordered.includes(selectedSource)?selectedSource:ordered[0])}setTimeout(()=>map.invalidateSize(),0)});
</script>
</body>
</html>
